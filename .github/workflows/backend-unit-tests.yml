name: Backend Unit Tests

on:
  push:
    branches:
      - "refactor/**"
      - "feature/**"
      - "fix/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-unit-tests.yml"
  pull_request:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-unit-tests.yml"

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore ./TransparenciaPE.sln

      - name: Build solution
        run: dotnet build ./TransparenciaPE.sln --no-restore --configuration Release

      - name: Run unit tests with coverage
        run: |
          dotnet test ./TransparenciaPE.sln \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings ./coverlet.runsettings \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/TestResults/

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: backend/TestResults/test-results.trx
          reporter: dotnet-trx
          fail-on-error: true
