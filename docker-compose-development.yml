version: "3.8"

services:
  postgres:
    image: postgres:14-alpine
    container_name: transparencia-postgres-dev
    environment:
      - POSTGRES_DB=portal-custos-pe
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal-custos-pe"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5034:5034"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5034
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=portal-custos-pe;Username=postgres;Password=root
      - CORS__AllowedOrigins=http://localhost:5173,http://frontend:80
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data_dev:
